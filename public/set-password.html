<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Սահմանել գաղտնաբառը</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container" style="max-width: 600px;">
    <h1>Սահմանել գաղտնաբառը</h1>
    <p class="subtitle">Լրացրեք նոր գաղտնաբառը՝ գրանցումն ավարտելու համար</p>

    <form id="setPasswordForm" class="panel">
      <div class="field">
        <label for="email">Էլ․ փոստ</label>
        <input id="email" type="email" readonly />
      </div>

      <div class="field">
        <label for="password">Գաղտնաբառ</label>
        <div class="password-wrapper">
          <input id="password" type="password" required />
          <button
            type="button"
            id="togglePassword"
            class="toggle-password-btn"
            aria-label="Ցույց տալ գաղտնաբառը"
            title="Ցույց տալ / թաքցնել գաղտնաբառը"
          >
            👁️
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Կրկնել գաղտնաբառը</label>
        <div class="password-wrapper">
          <input id="confirmPassword" type="password" required />
          <button
            type="button"
            id="toggleConfirmPassword"
            class="toggle-password-btn"
            aria-label="Ցույց տալ գաղտնաբառը"
            title="Ցույց տալ / թաքցնել գաղտնաբառը"
          >
            👁️
          </button>
        </div>
      </div>

      <div class="actions" style="margin-top: 16px;">
        <button type="submit" id="setPasswordBtn">Պահպանել գաղտնաբառը</button>
      </div>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script src="/set-password.js"></script>
</body>
</html>
